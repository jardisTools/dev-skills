name: CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'skills/**'
      - 'bin/**'
      - 'catalog/**'
      - 'docs/**'
      - 'router/**'
      - 'scripts/**'
      - 'README.md'
      - 'composer.json'
      - '.github/workflows/**'
      - 'Makefile'
      - 'makefile'
      - 'phpcs.xml'
      - 'phpstan.neon'
      - 'phpunit.xml'
      - '.env.example'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'skills/**'
      - 'bin/**'
      - 'catalog/**'
      - 'docs/**'
      - 'router/**'
      - 'scripts/**'
      - 'README.md'
      - 'composer.json'
      - '.github/workflows/**'
      - 'Makefile'
      - 'makefile'
      - 'phpcs.xml'
      - 'phpstan.neon'
      - 'phpunit.xml'
      - '.env.example'
  workflow_dispatch:

jobs:
  phpcs:
    name: phpcs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        run: cp .env.example .env

      - name: Login to Docker Hub
        if: ${{ github.actor != 'dependabot[bot]' }}
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: |
          mkdir -p $DOCKER_CONFIG
          echo "${{ secrets.DOCKER_PAT }}" | docker login -u "${{ secrets.DOCKER_USER_NAME }}" --password-stdin

      - name: Install dependencies
        run: make install

      - name: Check Code Standards
        run: make phpcs

      - name: Cleanup
        if: always()
        run: make remove

      - name: Logout from Docker Hub
        if: always()
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: docker logout

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        run: cp .env.example .env

      - name: Login to Docker Hub
        if: ${{ github.actor != 'dependabot[bot]' }}
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: |
          mkdir -p $DOCKER_CONFIG
          echo "${{ secrets.DOCKER_PAT }}" | docker login -u "${{ secrets.DOCKER_USER_NAME }}" --password-stdin

      - name: Install dependencies
        run: make install

      - name: Run PHPStan
        run: make phpstan

      - name: Cleanup
        if: always()
        run: make remove

      - name: Logout from Docker Hub
        if: always()
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: docker logout

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The update test archives the release tag v1.3.6 and needs full history and tags.
          fetch-depth: 0

      - name: Setup environment
        run: cp .env.example .env

      - name: Login to Docker Hub
        if: ${{ github.actor != 'dependabot[bot]' }}
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: |
          mkdir -p $DOCKER_CONFIG
          echo "${{ secrets.DOCKER_PAT }}" | docker login -u "${{ secrets.DOCKER_USER_NAME }}" --password-stdin

      - name: Install dependencies
        run: make install

      - name: Run PHPUnit Tests
        run: make phpunit-coverage

      - name: Cleanup
        if: always()
        run: make remove

      - name: Logout from Docker Hub
        if: always()
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: docker logout

  validate-skills:
    name: validate-skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        run: cp .env.example .env

      - name: Login to Docker Hub
        if: ${{ github.actor != 'dependabot[bot]' }}
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: |
          mkdir -p $DOCKER_CONFIG
          echo "${{ secrets.DOCKER_PAT }}" | docker login -u "${{ secrets.DOCKER_USER_NAME }}" --password-stdin

      - name: Install dependencies
        run: make install

      - name: Validate bundled SKILL.md files against docs/SKILL-FORMAT.md
        run: make validate-skills

      - name: Cleanup
        if: always()
        run: make remove

      - name: Logout from Docker Hub
        if: always()
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: docker logout

  check-public-text:
    name: check-public-text
    runs-on: ubuntu-latest
    env:
      PUBLIC_TEXT_DENYLIST: ${{ secrets.PUBLIC_TEXT_DENYLIST }}
      # Denylist is required (fail-closed) except where the secret is unavailable:
      # fork PRs and Dependabot runs cannot read Actions secrets. Push and same-repo PRs stay '1'.
      PUBLIC_TEXT_REQUIRE_DENYLIST: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.actor == 'dependabot[bot]') && '0' || '1' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        run: cp .env.example .env

      - name: Login to Docker Hub
        if: ${{ github.actor != 'dependabot[bot]' }}
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: |
          mkdir -p $DOCKER_CONFIG
          echo "${{ secrets.DOCKER_PAT }}" | docker login -u "${{ secrets.DOCKER_USER_NAME }}" --password-stdin

      - name: Install dependencies
        run: make install

      - name: Check public texts for home paths and private terms
        run: make check-public-text

      - name: Cleanup
        if: always()
        run: make remove

      - name: Logout from Docker Hub
        if: always()
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: docker logout

  generate-catalog-check:
    name: generate-catalog-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        run: cp .env.example .env

      - name: Login to Docker Hub
        if: ${{ github.actor != 'dependabot[bot]' }}
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: |
          mkdir -p $DOCKER_CONFIG
          echo "${{ secrets.DOCKER_PAT }}" | docker login -u "${{ secrets.DOCKER_USER_NAME }}" --password-stdin

      - name: Install dependencies
        run: make install

      - name: Check that skills/jardis-catalog/SKILL.md matches catalog/manifest.json
        run: make generate-catalog-check

      - name: Cleanup
        if: always()
        run: make remove

      - name: Logout from Docker Hub
        if: always()
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: docker logout

  check-catalog-packagist:
    name: check-catalog-packagist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        run: cp .env.example .env

      - name: Login to Docker Hub
        if: ${{ github.actor != 'dependabot[bot]' }}
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: |
          mkdir -p $DOCKER_CONFIG
          echo "${{ secrets.DOCKER_PAT }}" | docker login -u "${{ secrets.DOCKER_USER_NAME }}" --password-stdin

      - name: Install dependencies
        run: make install

      - name: Check Packagist for Jardis packages missing from catalog/manifest.json (informational)
        run: make check-catalog-packagist

      - name: Cleanup
        if: always()
        run: make remove

      - name: Logout from Docker Hub
        if: always()
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: docker logout
